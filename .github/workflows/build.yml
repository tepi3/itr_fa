name: Build and Release Portable Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: fa_desk_macOS
            sep: ":"
            icon: "static/icon.png"
          - os: windows-latest
            name: fa_desk_Windows
            sep: ";"
            icon: "static/icon.ico"
          - os: ubuntu-latest
            name: fa_desk_Linux
            sep: ":"
            icon: "static/icon.png"
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Linux system dependencies (for pywebview GTK/WebKit)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          python3-gi \
          gir1.2-gtk-3.0 \
          gir1.2-webkit2-4.1 \
          libgirepository1.0-dev \
          gcc \
          libcairo2-dev \
          pkg-config

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: >
        pyinstaller
        --name ${{ matrix.name }}
        --onefile
        --windowed
        --icon "${{ matrix.icon }}"
        --add-data "templates${{ matrix.sep }}templates"
        --add-data "static${{ matrix.sep }}static"
        app.py

    - name: Package macOS App Bundle
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        /usr/bin/ditto -c -k --keepParent "${{ matrix.name }}.app" "${{ matrix.name }}.zip"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: |
          dist/${{ matrix.name }}
          dist/${{ matrix.name }}.zip
          dist/${{ matrix.name }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fa_desk_macOS.zip
            dist/fa_desk_Windows.exe
            dist/fa_desk_Linux
          generate_release_notes: true
